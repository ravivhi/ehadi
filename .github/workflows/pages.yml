# Publishes the app with this repo's own GitHub Pages: https://ravivh.com/ehadi/
# (ravivh.com is the custom domain of ravivhi/ravivhi.github.io, so every repo's Pages site
# is served at ravivh.com/<repo>/.) tests/, android/, play-assets/, tts-proxy/ and repo files
# are left out of the published site.
name: Publish to ravivh.com/ehadi (Pages)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/**'
      - 'android/**'
      - 'play-assets/**'
      - 'tts-proxy/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          rsync -a --exclude '.git/' --exclude '.github/' --exclude 'tests/' --exclude 'android/' \
            --exclude 'play-assets/' --exclude 'tts-proxy/' --exclude '_site/' \
            --exclude '.gitignore' --exclude '*.md' ./ _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
